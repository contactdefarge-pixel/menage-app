# Outil de diagnostic : appelle une URL de l'appli et affiche la réponse en annotation
name: Diagnostic
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Chemin à appeler (ex. /api/logement?slug=...)"
        required: true
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          r=$(curl -s --max-time 60 "https://agents.izinest.fr${{ github.event.inputs.path }}" | head -c 3500 | tr '\n' ' ')
          echo "::notice title=diag::$r"
