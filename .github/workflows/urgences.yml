# Vérifie toutes les 5 minutes s'il y a une mission de dernière minute (0 à 3 jours) à signaler par e-mail.
name: Urgences missions
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 60 "https://agents.izinest.fr/api/cron-notify?urgent=1"
      - name: Garder la liste des missions prête (évite le démarrage à froid)
        run: curl -sS --max-time 30 "https://agents.izinest.fr/api/missions" > /dev/null || true
