# Toutes les 15 minutes : synchro Beds24 -> Missions (les nouvelles réservations créent leurs missions,
# et une mission à J+0..J+3 déclenche aussitôt l'e-mail urgent). Nécessite le secret GitHub CRON_SECRET.
name: Synchro réservations
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Appel de la synchro Beds24
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::warning::Secret CRON_SECRET manquant"; exit 0; fi
          for essai in 1 2 3; do
            code=$(curl -sS --max-time 90 -o reponse.txt -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "https://agents.izinest.fr/api/sync-missions" || echo 000)
            if [ "$code" = "200" ]; then exit 0; fi
            echo "Essai $essai : HTTP $code"
            sleep 20
          done
          echo "::error title=Synchro en échec (HTTP $code)::$(head -c 600 reponse.txt 2>/dev/null | tr '\n' ' ')"
          exit 1
